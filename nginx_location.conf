# === MAPS DEFINITION FOR WEBSOCKET SUPPORT ===
# Isso garante que o header 'Connection' seja 'Upgrade' quando necessário (WebSockets),
# e 'close' caso contrário. Evita problemas comuns de proxy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# --- FRONTEND USER (location.cubevisservice.site) ---
server {
    listen 80;
    server_name location.cubevisservice.site;
    # Redireciona tudo para HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name location.cubevisservice.site;

    # Certificados SSL (LetsEncrypt)
    ssl_certificate /etc/letsencrypt/live/cubevisservice.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cubevisservice.site/privkey.pem;

    # Melhores práticas de SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://127.0.0.1:1880;
        proxy_http_version 1.1;
        
        # Headers Padrão
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- FRONTEND ADMIN (admin.location.cubevisservice.site) ---
server {
    listen 443 ssl http2;
    server_name admin.location.cubevisservice.site;

    ssl_certificate /etc/letsencrypt/live/cubevisservice.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cubevisservice.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://127.0.0.1:1890;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- BACKEND API & WEBSOCKETS (api.location.cubevisservice.site) ---
server {
    listen 443 ssl http2;
    server_name api.location.cubevisservice.site;

    ssl_certificate /etc/letsencrypt/live/cubevisservice.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cubevisservice.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://127.0.0.1:1800;
        proxy_http_version 1.1;

        # --- WEBSOCKET CRITICAL HEADERS ---
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Headers informativos para o Backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- TIMEOUTS & BUFFERING ---
        # Aumentar timeouts para evitar que o Nginx derrube a conexão WebSocket inativa
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        # Desativar buffering para garantir tempo real (importante para latência)
        proxy_buffering off;
    }
}
