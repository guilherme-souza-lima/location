<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Service | Provider</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                    },
                    colors: {
                        earth: {
                            bg: '#f0f0d8',      // .color4
                            card: '#ffffff',
                            text: '#5a372c',    // .color1
                            sub: '#8b8b70',     // .color2
                            border: '#8b8b70',  // .color2
                            primary: '#c94b0c', // .color5
                            success: '#98c7b0', // .color3
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f0f0d8;
            color: #5a372c;
        }
    </style>
</head>

<body class="h-screen w-full flex flex-col items-center justify-center p-4 font-sans">

    <div class="z-10 w-full max-w-[400px]">

        <!-- Header -->
        <div class="mb-8 text-center space-y-2">
            <div
                class="inline-flex items-center justify-center bg-white border border-earth-border p-3 rounded-sm shadow-sm mb-2 text-earth-primary">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-earth-text uppercase">Field Uplink</h1>
            <p class="text-earth-sub text-sm font-medium">Secure Telemetry Bridge</p>
        </div>

        <!-- Main Card -->
        <div class="bg-white border border-earth-border rounded-sm shadow-xl overflow-hidden p-6 md:p-8">

            <!-- Setup Section -->
            <div id="setup-panel" class="space-y-6">

                <div class="space-y-4">
                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold uppercase tracking-wider text-earth-sub">Operative
                            Name</label>
                        <input type="text" id="provider-name"
                            class="w-full bg-[#fdfdf5] border border-earth-border text-earth-text p-3.5 rounded-sm text-sm font-medium transition-all focus:outline-none focus:border-earth-primary focus:ring-1 focus:ring-earth-primary placeholder:text-earth-sub/50"
                            placeholder="John Doe">
                    </div>

                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold uppercase tracking-wider text-earth-sub">Device ID</label>
                        <div class="relative">
                            <input type="text" id="provider-id" value="UNIT-ALPHA-01"
                                class="w-full bg-[#fdfdf5] border border-earth-border text-earth-text p-3.5 rounded-sm text-sm font-mono transition-all focus:outline-none focus:border-earth-primary focus:ring-1 focus:ring-earth-primary placeholder:text-earth-sub/50 uppercase"
                                placeholder="DEVICE-ID">
                            <div
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-bold text-earth-sub bg-earth-bg px-2 py-0.5 rounded-sm border border-earth-border">
                                AUTO</div>
                        </div>
                    </div>
                </div>

                <div class="bg-earth-bg p-4 rounded-sm border border-earth-border/50">
                    <div class="flex gap-3">
                        <svg class="w-5 h-5 text-earth-sub flex-shrink-0" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <p class="text-xs text-earth-text leading-relaxed font-medium">
                            Enable location services to proceed with uplink initialization.
                        </p>
                    </div>
                </div>

                <button id="start-btn"
                    class="w-full bg-earth-primary hover:bg-[#a63d0a] text-[#f0f0d8] font-bold py-4 px-6 rounded-sm shadow-md transition-all duration-200 flex items-center justify-center gap-2 group uppercase tracking-wider">
                    <span>Iniciate Uplink</span>
                    <svg class="w-4 h-4 transition-transform group-hover:translate-x-0.5" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
                    </svg>
                </button>
            </div>

            <!-- Active Section (Hidden by default) -->
            <div id="active-panel" class="hidden">

                <div class="flex items-center justify-between mb-8 border-b border-earth-border/20 pb-4">
                    <div class="flex items-center gap-3">
                        <div class="relative flex items-center justify-center h-3 w-3">
                            <span
                                class="animate-ping absolute inline-flex h-full w-full rounded-full bg-earth-success opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-earth-success"></span>
                        </div>
                        <div>
                            <div class="text-[10px] font-bold text-earth-sub uppercase tracking-wider">Status</div>
                            <div id="connection-status" class="text-sm font-bold text-earth-text uppercase">
                                Connecting...</div>
                        </div>
                    </div>
                    <button onclick="location.reload()"
                        class="p-2 text-earth-sub hover:text-red-600 hover:bg-red-50 rounded-full transition-colors"
                        title="Disconnect">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                            </path>
                        </svg>
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-8">
                    <div class="bg-[#fdfdf5] p-4 rounded-sm border border-earth-border">
                        <div class="text-[10px] font-bold text-earth-sub uppercase tracking-wider mb-1">Latitude</div>
                        <div id="lat-display" class="font-mono text-lg font-bold text-earth-text tracking-tight">
                            --.-----</div>
                    </div>
                    <div class="bg-[#fdfdf5] p-4 rounded-sm border border-earth-border">
                        <div class="text-[10px] font-bold text-earth-sub uppercase tracking-wider mb-1">Longitude</div>
                        <div id="lng-display" class="font-mono text-lg font-bold text-earth-text tracking-tight">
                            --.-----</div>
                    </div>
                </div>

                <div class="flex flex-col items-center justify-center space-y-3 py-2">
                    <div class="w-full bg-earth-bg rounded-full h-1.5 overflow-hidden border border-earth-border/30">
                        <div class="h-full bg-earth-primary w-1/3 animate-[progress_2s_ease-in-out_infinite]"></div>
                    </div>
                    <span id="status-msg"
                        class="text-[10px] font-mono font-medium text-earth-sub uppercase">Initializing...</span>
                </div>

            </div>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-center px-4">
            <div class="flex items-center justify-center gap-2 mb-2">
                <div class="h-px w-8 bg-earth-border"></div>
                <span class="text-[10px] uppercase font-bold text-earth-sub tracking-widest">Sys v3.0</span>
                <div class="h-px w-8 bg-earth-border"></div>
            </div>
        </div>
    </div>

    <style>
        @keyframes progress {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(300%);
            }
        }
    </style>

    <script>
        const startBtn = document.getElementById('start-btn');
        const setupPanel = document.getElementById('setup-panel');
        const activePanel = document.getElementById('active-panel');
        const statusMsg = document.getElementById('status-msg');

        const connectionStatus = document.getElementById('connection-status');
        const latDisplay = document.getElementById('lat-display');
        const lngDisplay = document.getElementById('lng-display');

        const providerIdInput = document.getElementById('provider-id');
        const providerNameInput = document.getElementById('provider-name');
        let ws;
        let watchId;

        // Generate Random ID
        const randomId = 'UNIT-' + Math.floor(Math.random() * 10000).toString().padStart(4, '0');
        providerIdInput.value = randomId;

        startBtn.addEventListener('click', () => {
            if (ws) return;

            // Simple Validations
            if (!providerNameInput.value.trim()) {
                providerNameInput.focus();
                return;
            }

            // UI Transition
            setupPanel.classList.add('hidden');
            activePanel.classList.remove('hidden');
            statusMsg.textContent = "ESTABLISHING SECURE LINK...";

            let wsUrl;
            if (window.location.hostname.includes('cubevisservice.site')) {
                wsUrl = `wss://api.location.cubevisservice.site/ws?type=provider&id=${providerIdInput.value}`;
            } else {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                wsUrl = `${protocol}//${window.location.hostname}:1800/ws?type=provider&id=${providerIdInput.value}`;
            }

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                connectionStatus.textContent = 'LINK ESTABLISHED';
                connectionStatus.classList.add('text-earth-success');
                statusMsg.textContent = "TRANSMITTING TELEMETRY";
                startGeolocation();
            };

            ws.onclose = () => {
                connectionStatus.textContent = 'DISCONNECTED';
                connectionStatus.className = 'text-sm font-bold text-red-600 uppercase';
                statusMsg.textContent = "SIGNAL LOST. RECONNECTING...";
                stopGeolocation();
                ws = null;
            };

            ws.onerror = (err) => {
                console.error('WS Error', err);
                connectionStatus.textContent = 'CONNECTION ERROR';
                connectionStatus.classList.add('text-red-600');
            };
        });

        function startGeolocation() {
            if (!navigator.geolocation) {
                statusMsg.textContent = "ERROR: GEOLOCATION NOT SUPPORTED";
                return;
            }

            watchId = navigator.geolocation.watchPosition((position) => {
                const { latitude, longitude } = position.coords;

                // Update Display
                latDisplay.textContent = latitude.toFixed(5);
                lngDisplay.textContent = longitude.toFixed(5);

                const name = providerNameInput.value.trim() || `Agent ${providerIdInput.value}`;

                const payload = {
                    id: providerIdInput.value,
                    lat: latitude,
                    lng: longitude,
                    info: name
                };

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify(payload));
                }
            }, (error) => {
                console.error('Geo Error', error);
                statusMsg.textContent = `LOCATION ERROR: ${error.message}`;
            }, {
                enableHighAccuracy: true,
                timeout: 20000,
                maximumAge: 5000
            });
        }

        function stopGeolocation() {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
        }
    </script>
</body>

</html>
